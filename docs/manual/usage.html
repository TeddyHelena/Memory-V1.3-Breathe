<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Breathe 使用说明书 · 记忆与记忆链</title>
<style>
:root{
  --paper:#F5F8FC;--surface:#fff;--surface2:#EEF4FB;--ink:#0F172A;--ink2:#344054;--muted:#667085;--faint:#98A2B3;
  --line:#DCE6F2;--line2:#EAF0F7;--blue:#2F6FED;--blue2:#1D5BD6;--blueSoft:#EDF4FF;--blueLine:#C9DCFA;
  --green:#1F9D63;--greenSoft:#EAF7F0;--amber:#B26A00;--amberSoft:#FFF6E6;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --font:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",-apple-system,system-ui,sans-serif;
}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:14px/1.7 var(--font);-webkit-font-smoothing:antialiased}
button,input{font:inherit}.wrap{max-width:1120px;margin:auto;padding:0 28px}
.nav{position:sticky;top:0;z-index:20;background:rgba(245,248,252,.92);border-bottom:1px solid var(--line);backdrop-filter:blur(12px)}
.navin{height:58px;display:flex;align-items:center;gap:10px}.logo{width:24px;height:24px;border-radius:7px;background:var(--blue);color:#fff;display:grid;place-items:center;font:11px var(--mono)}
.brand{font-weight:700;font-size:13.5px}.badge{font:9px var(--mono);color:var(--blue);background:var(--blueSoft);border:1px solid var(--blueLine);border-radius:999px;padding:2px 7px}
.nav .sp{flex:1}.nav .h{font-size:11.5px;color:var(--muted)}
.hero{padding:46px 0 24px}.eyebrow{font:9.5px var(--mono);letter-spacing:.14em;color:var(--blue)}
h1{font-size:clamp(30px,4.4vw,48px);line-height:1.15;letter-spacing:-.04em;margin:10px 0 12px;font-weight:700}
h1 em{font-style:normal;color:var(--blue)}.hero p{font-size:14px;color:var(--muted);max-width:44em;margin:0}
.shell{display:grid;grid-template-columns:250px minmax(0,1fr);gap:28px;align-items:start;padding-bottom:50px}
.steps{position:sticky;top:78px;background:#fff;border:1px solid var(--line);border-radius:13px;padding:12px}
.steps .k{font:9px var(--mono);letter-spacing:.12em;color:var(--faint);margin:3px 7px 8px}
.steps button{width:100%;display:flex;gap:8px;align-items:center;border:0;background:none;text-align:left;padding:8px;border-radius:7px;color:var(--muted);font-size:12px;cursor:pointer}
.steps button:hover{background:var(--surface2)}.steps button.on{background:var(--blueSoft);color:var(--ink)}.steps .n{font:9px var(--mono);color:var(--faint);width:17px}
.content{min-width:0}
.panel{background:#fff;border:1px solid var(--line);border-radius:13px;padding:20px 22px;box-shadow:0 12px 30px -28px rgba(15,23,42,.3)}
.panel h2{font-size:18px;letter-spacing:-.02em;margin:0 0 4px}.panel .lead{font-size:12.5px;color:var(--muted);margin:0 0 14px}
.panel p{font-size:12.5px;color:var(--muted);margin:8px 0}.panel b{color:var(--ink)}
.codepre{background:#0F172A;border-radius:9px;padding:13px;margin:9px 0;overflow:auto}
.codepre code{font:10.5px/1.7 var(--mono);color:#D7E4F3;white-space:pre-wrap}
.chat{border:1px solid var(--line);border-radius:10px;background:#FBFDFF;padding:10px;margin:9px 0}
.msg{max-width:92%;border-radius:9px;padding:8px 10px;font-size:12px;line-height:1.6;margin:5px 0}
.me{margin-left:auto;background:var(--blue);color:#fff}.ai{background:#fff;border:1px solid var(--line);color:var(--ink2)}
.tagrow{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.tag{font:9.5px var(--mono);border:1px solid var(--line);background:#fff;border-radius:999px;padding:3px 8px;color:var(--ink2);cursor:pointer}
.tag.on{background:var(--blueSoft);border-color:var(--blueLine);color:var(--blue)}
.tag:hover{border-color:var(--blueLine)}
.tbl{width:100%;border-collapse:collapse;font-size:12px;margin:8px 0}.tbl th,.tbl td{border-bottom:1px solid var(--line);padding:8px;text-align:left;vertical-align:top}.tbl th{background:var(--surface2);color:var(--ink2);font-weight:600}.tbl td{color:var(--muted)}.tbl code{font:10.5px var(--mono);background:var(--surface2);border-radius:3px;padding:1px 4px}
.note{background:var(--blueSoft);border:1px solid var(--blueLine);border-radius:9px;padding:9px 11px;font-size:11.5px;color:#244A9B;margin:10px 0}
.warn{background:var(--amberSoft);border:1px solid #F0D6A8;border-radius:9px;padding:9px 11px;font-size:11.5px;color:#6B4300;margin:10px 0}
.navbtns{display:flex;gap:8px;align-items:center;margin-top:14px}.btn{border:1px solid var(--line);background:#fff;border-radius:7px;padding:6px 11px;font-size:11.5px;color:var(--ink2);cursor:pointer}.btn.p{background:var(--blue);border-color:var(--blue);color:#fff}.btn:disabled{opacity:.4;cursor:not-allowed}.count{margin-left:auto;font:9.5px var(--mono);color:var(--faint)}
.mock{margin-top:14px;background:#EFF4FA;border:1px solid var(--line);border-radius:12px;padding:10px}
.win{background:#fff;border:1px solid #CFDDEB;border-radius:8px;overflow:hidden}
.winbar{height:26px;display:flex;align-items:center;gap:5px;padding:0 8px;background:#FCFDFF;border-bottom:1px solid var(--line);font:8px var(--mono);color:var(--faint)}
.winbar i{width:6px;height:6px;border-radius:50%;background:#D5DFEA}
.winbody{padding:10px;background:#F7FAFD}
.minihead{display:flex;justify-content:space-between;align-items:center;margin-bottom:7px}.minihead b{font-size:10px}.minihead span{font:7px var(--mono);color:var(--faint)}
.chain{display:grid;gap:6px}.chainrow{display:flex;align-items:center;gap:7px;font-size:9px;color:var(--muted);background:#fff;border:1px solid var(--line2);border-radius:6px;padding:6px 7px}
.chainrow b{color:var(--ink);font-size:10px}.chaindot{width:6px;height:6px;border-radius:50%;background:var(--green);flex:none}.chainrow .sp{flex:1}.chainrow span{font:8px var(--mono);color:var(--faint)}
.footer{padding:20px 0 40px;font-size:11px;color:var(--faint)}
@media(max-width:820px){.wrap{padding:0 18px}.shell{grid-template-columns:1fr}.steps{position:static;display:flex;gap:5px;overflow:auto}.steps .k{display:none}.steps button{width:auto;white-space:nowrap}.nav .h{display:none}h1{font-size:34px}}
</style>
</head>
<body>
<header class="nav"><div class="wrap navin"><span class="logo">M</span><span class="brand">Breathe 使用说明书</span><span class="badge">0.16.3</span><span class="sp"></span><span class="h">已安装 · 从「记忆」开始</span></div></header>
<div class="wrap hero">
  <div class="eyebrow">USAGE · MEMORY &amp; CHAIN</div>
  <h1>点开「记忆」，<br>先看它在记什么。</h1>
  <p>左侧栏的「记忆」就是 Breathe 的入口。第一次会看到「认识一下」；填完后再进来，就是记忆页。下面只教你两件事：怎么看，怎么把一条记忆放进正确的链。</p>
</div>

<div class="wrap shell">
  <nav class="steps" id="steps"></nav>
  <main class="content">
    <div class="panel">
      <h2 id="t"></h2><p class="lead" id="l"></p><div id="body"></div>
      <div class="navbtns"><button class="btn" id="prev">上一步</button><button class="btn p" id="next">下一步</button><span class="count" id="cnt"></span></div>
    </div>
    <div class="mock" id="mock"></div>
  </main>
</div>
<footer class="wrap footer">Breathe 0.16.3 · 记忆链是「读出来的」：标签决定项目，会话决定环。当前没有“新建链”按钮。</footer>

<script>
const steps=[
  {
    t:'左上角「记忆」是什么',
    l:'它不是“认识一下”，是 Breathe 的主页面。认识一下只在第一次出现。',
    body:`<div class="chat">
      <div class="msg me">点左侧栏「记忆」</div>
      <div class="msg ai">第一次安装：进入「认识一下」——填称呼、名字、性别、关系。</div>
      <div class="msg ai">填完后再点「记忆」：直接进入记忆页，看到记忆 / 记忆链 / 最近写入。</div>
    </div>
    <p><b>如果又看到认识一下：</b>这次安装/版本更新后还没走完；按向导填完，之后不会反复弹。</p>
    <div class="note">记忆页顶部有两个镜头：<b>记忆</b> 看条目，<b>记忆链</b> 看归属。</div>`,
    mock:`<div class="win"><div class="winbar"><i></i><i></i><i></i>DSH · 记忆</div><div class="winbody"><div class="minihead"><b>记忆</b><span>MEMORY</span></div><div class="chain"><div class="chainrow"><span class="chaindot"></span><b>记忆</b><span class="sp"></span><span>条目</span></div><div class="chainrow"><span class="chaindot" style="background:var(--blue)"></span><b>记忆链</b><span class="sp"></span><span>归属</span></div><div class="chainrow"><span class="chaindot" style="background:#C8D6E5"></span><b>最近写入</b><span class="sp"></span><span>新条目</span></div></div></div></div>`
  },
  {
    t:'一条记忆放在哪条链？',
    l:'不是设置表单，是标签。链页按标签把条目分到项目；标签不对，链就进错组。',
    body:`<p>打开一条记忆 → 编辑 → 看 <b>标签</b>。链页用的就是它：</p>
    <table class="tbl"><thead><tr><th>标签</th><th>进哪条链</th></tr></thead><tbody>
      <tr><td><code>Breathe</code></td><td>Breathe</td></tr>
      <tr><td><code>Lite</code></td><td>Lite</td></tr>
      <tr><td><code>Start</code></td><td>Start</td></tr>
      <tr><td><code>Vigil / 测试 / 安全 / 方法</code></td><td>Vigil</td></tr>
      <tr><td><code>版本 / 事故 / 决策 / 技术 / 设计 / 商业 / 需求 / 文案 / 反馈 / 法务 / 团队 / 否决 / 活动 / 归档 / 其他</code></td><td>沿革</td></tr>
      <tr><td><code>人物 / 生活 / 本人 / 偏好 / 环境 / 身份</code></td><td>个人</td></tr>
      <tr><td>其它标签 / 没标签</td><td>其他 / 史前未归</td></tr>
    </tbody></table>
    <div class="warn"><b>当前 Breathe 的真实边界</b>：链页的项目组是预置的，没有“新建项目链”按钮；随意造一个新标签会落到「其他」。链识别是下一版 Pulse 的技术债，不是用户操作能绕过的。</div>`,
    mock:`<div class="win"><div class="winbar"><i></i><i></i><i></i>编辑 · 标签</div><div class="winbody"><div class="minihead"><b>一条记忆</b><span>TAGS</span></div><div class="tagrow" id="tagpick"></div><div class="chain" id="chainmap"></div></div></div>`,
    after(){
      const tags=['Breathe','Lite','Start','Vigil','版本','人物','随手标签'];
      const map={'Breathe':'Breathe','Lite':'Lite','Start':'Start','Vigil':'Vigil','版本':'沿革','人物':'个人','随手标签':'其他'};
      const box=document.getElementById('tagpick'), out=document.getElementById('chainmap');
      box.innerHTML=tags.map((t,i)=>`<button class="tag ${i===0?'on':''}" data-t="${t}">${t}</button>`).join('');
      const paint=()=>{const on=box.querySelector('.tag.on');const t=on?on.dataset.t:'Breathe';out.innerHTML=`<div class="chainrow"><span class="chaindot"></span><b>${map[t]}</b><span class="sp"></span><span>这条记忆</span></div>`};
      box.onclick=e=>{const b=e.target.closest('.tag');if(!b)return;box.querySelectorAll('.tag').forEach(x=>x.classList.toggle('on',x===b));paint()};paint();
    }
  },
  {
    t:'写的时候就用对话打标签',
    l:'最省事的办法：说“记住……，标签 Breathe”。助手会带着标签写；你只需要在记忆页确认。',
    body:`<div class="chat">
      <div class="msg me">记住：Breathe 的发布门禁是 665/665。<br>标签：Breathe</div>
      <div class="msg ai">已记住。落点：longterm；标签：Breathe。</div>
      <div class="msg me">把刚才那条改到 Lite。</div>
      <div class="msg ai">已更新标签：Lite。</div>
    </div>
    <p><b>不要这样说：</b>“你看着归一下类。” —— 模型会猜；猜错你还要再改。直接给标签，最稳。</p>
    <p><b>没有标签的旧记忆：</b>打开条目补标签；不要为了“先放进链”去改 JSON。</p>`,
    mock:`<div class="win"><div class="winbar"><i></i><i></i><i></i>DSH · 对话</div><div class="winbody"><div class="msg me">记住：Breathe 的发布门禁是 665/665。标签：Breathe</div><div class="msg ai">已记住 · longterm · #Breathe</div><div class="chain"><div class="chainrow"><span class="chaindot"></span><b>Breathe</b><span class="sp"></span><span>665/665</span></div></div></div></div>`
  },
  {
    t:'改已有记忆：编辑标签',
    l:'记忆页点条目 → 编辑 → 改标签 → 保存。链页不是另一个数据库，保存后回链页就能看到。',
    body:`<ol style="font-size:12.5px;color:var(--muted);padding-left:18px">
      <li>「记忆」镜头里找到那条；</li>
      <li>点开 → 编辑；</li>
      <li>在标签框里加/删标签，保存；</li>
      <li>切到「记忆链」镜头，确认它在正确项目下。</li>
    </ol>
    <div class="note">标签只是归属，不改正文；改错了再改标签即可，不需要重建记忆。</div>
    <div class="warn">不要手改 <code>index.json</code> 或条目文件来“加速”归属；插件的索引和文件必须一致，手改会制造 split-brain。</div>`,
    mock:`<div class="win"><div class="winbar"><i></i><i></i><i></i>记忆 · 条目</div><div class="winbody"><div class="minihead"><b>一条记忆</b><span>EDIT</span></div><div class="chain"><div class="chainrow"><b>标签</b><span class="sp"></span><span>Breathe / 版本</span></div><div class="chainrow"><b>层</b><span class="sp"></span><span>longterm</span></div><div class="chainrow"><b>状态</b><span class="sp"></span><span>active</span></div></div></div></div>`
  },
  {
    t:'链页怎么读',
    l:'系统 → 项目 → 环（对话）。项目下面是这次对话产生的条目，不是文件夹。',
    body:`<ul style="font-size:12.5px;color:var(--muted);padding-left:18px">
      <li><b>项目</b>：由标签决定，比如 Breathe / Lite / 个人；</li>
      <li><b>环</b>：一次对话；环会随年龄变浅；</li>
      <li><b>候选</b>：不进链，留在候选区；</li>
      <li><b>史前/未归</b>：没有会话归属的老条目，不会硬塞进链。</li>
    </ul>
    <div class="note">链页是观察面，不是编辑器。要改归属，回「记忆」改标签。</div>`,
    mock:`<div class="win"><div class="winbar"><i></i><i></i><i></i>DSH · 记忆链</div><div class="winbody"><div class="minihead"><b>Breathe</b><span>PROJECT</span></div><div class="chain"><div class="chainrow"><span class="chaindot"></span><b>11-14</b><span class="sp"></span><span>3 条</span></div><div class="chainrow"><span class="chaindot" style="background:#B9D8CB"></span><b>11-10</b><span class="sp"></span><span>2 条</span></div><div class="chainrow"><span class="chaindot" style="background:#D6E3EC"></span><b>11-03</b><span class="sp"></span><span>1 条</span></div></div></div></div>`
  }
];
let i=0;const $=s=>document.querySelector(s);
function paint(){
  const s=steps[i];$('#t').textContent=s.t;$('#l').textContent=s.l;$('#body').innerHTML=s.body;$('#mock').innerHTML=s.mock;
  $('#cnt').textContent=String(i+1).padStart(2,'0')+' / '+String(steps.length).padStart(2,'0');
  $('#prev').disabled=i===0;$('#next').textContent=i===steps.length-1?'回到第一步':'下一步';
  $('#steps').innerHTML=steps.map((x,n)=>`<button data-i="${n}" class="${n===i?'on':''}"><span class="n">${String(n+1).padStart(2,'0')}</span>${x.t}</button>`).join('');
  $('#steps').querySelectorAll('button').forEach(b=>b.onclick=()=>{i=+b.dataset.i;paint()});
  if(s.after)s.after();
}
$('#prev').onclick=()=>{if(i>0){i--;paint()}};
$('#next').onclick=()=>{i=(i+1)%steps.length;paint()};paint();
</script>
</body>
</html>
